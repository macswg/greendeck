# Secret scanning rules, used by the pre-commit hook and CI.
# Starts from gitleaks' built-in rules (API keys, tokens, private keys, ...)
# and adds checks for personal details that aren't secrets but shouldn't be public.

[extend]
useDefault = true

[[rules]]
id = "personal-home-path"
description = "Absolute home directory path (leaks a username; use ~ or a relative path)"
regex = '''(/Users/|/home/)[A-Za-z0-9._-]+/'''

[[rules]]
id = "private-ip-address"
description = "Private network address (use localhost or make it configurable)"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''

[[rules]]
id = "tailscale-address"
description = "Tailscale/CGNAT address or tailnet name (personal network; keep it in greendeck.local.json)"
regex = '''\b(100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3}|[a-z0-9-]+\.[a-z0-9-]+\.ts\.net)\b'''

[allowlist]
paths = ['''package-lock\.json''']
